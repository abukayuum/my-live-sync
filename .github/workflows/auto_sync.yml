name: Auto Sync Stream Data

on:
  schedule:
    # প্রতি ২০ মিনিট পরপর স্বয়ংক্রিয়ভাবে রান হবে
    - cron: '*/20 * * * *'
  workflow_dispatch: # চাইলে বাটন চেপে ম্যানুয়ালিও রান করা যাবে

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        run: python sync.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          # ফাইলে নতুন কোনো পরিবর্তন থাকলে তবেই কমিট করবে
          git diff --staged --quiet || (git commit -m "Auto-sync live data: $(date -u)" && git push)
